<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask a Friend</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Ask a Friend</h1>

    <form id="paymentForm">

        <input
            id="firstName"
            type="text"
            placeholder="Your name"
            required
        >

        <input
            id="phone"
            type="tel"
            placeholder="M-Pesa phone number"
            required
        >

        <input
            id="amount"
            type="number"
            placeholder="Amount"
            min="10"
            required
        >

        <input
            id="reason"
            type="text"
            placeholder="Reason"
            required
        >

        <button id="payButton" type="submit">
            Send Payment Request
        </button>

    </form>

    <p id="status"></p>

    <script src="script.js"></script>

</body>
</html>
